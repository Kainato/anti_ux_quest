name: anti_ux_quest
description: "Um jogo em Flutter que transforma tarefas triviais em desafios de sobrevivência digital."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/anti-ux-quest-mark.svg
    - assets/brand/anti-ux-quest-icon.png
    - assets/brand/anti-ux-quest-icon-1024.png

